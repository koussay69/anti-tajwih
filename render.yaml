services:
  - type: web
    name: anti-tajwih
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DISABLE_EMAIL_VERIFICATION
        sync: false
