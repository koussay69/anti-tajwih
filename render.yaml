services:
  - type: web
    name: anti-tajwih
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAILERSEND_TOKEN
        sync: false
      - key: SMTP_FROM
        sync: false
